# 专业别名表:把职位表里出现的非目录名称映射到目录节点。
#
# 说明:
# 1. 这些名称不是教育部目录里的正式名称(多为招录机关自定义的大类),映射是根据名称含义推断的。
#    通过别名命中的条目会被标记为 partial,前端展示为「待确认」,不会直接判定为符合。
# 2. 值可以是单个节点 id,也可以是节点 id 列表。
# 3. 节点 id 格式:UG:<本科代码> / PG:<研究生代码>,见 catalogs/source 与 catalogs/*.json。
# 4. 新增别名前,先用 build 报告里的「未解析专业 Top N」核对招考简章对该名称的说明。

UG:
  财会审计类: [UG:120203K, UG:120204, UG:120207]   # 会计学、财务管理、审计学
  气象类: UG:0706                                   # 大气科学类
  社会保障类: UG:120403                             # 劳动与社会保障
  英语相关专业: [UG:050201, UG:050262, UG:050261]   # 英语、商务英语、翻译
  计算机科学与技术类: UG:0809                       # 计算机类

PG: {}
