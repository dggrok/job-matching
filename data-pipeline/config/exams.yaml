# ---------------- 江苏 ----------------
# 官方入口:江苏省人力资源和社会保障厅「人事考试网」公务员专栏 https://jshrss.jiangsu.gov.cn/col/col57253/ →「江苏省20XX年度考试录用公务员专题」;
# 同一批文件也发布在中共江苏省委组织部网站 https://www.jszzb.gov.cn/ 的「通知公告」里,该站的公告页含《职位简介表》压缩包(zip)和《专业参考目录》(doc)。
# 压缩包解压后的全部 xls 放进 raw/jiangsu-20XX/ 目录;《专业参考目录》另存为纯文本放到 catalogs/source/jiangsu-20XX-major-ref.txt。
jiangsu-2026:
  kind: shengkao
  province: 江苏
  name: 江苏省2026年度考试录用公务员
  type: jiangsu
  year: 2026
  graduateYear: 2026
  file: raw/jiangsu-2026       # 目录:16 份 xls(省级机关、13 个设区市、统计系统、监狱戒毒系统)
  majorRef: catalogs/source/jiangsu-2026-major-ref.txt
  publishedAt: 2025-10-31
  signup: 2025-11-04 至 2025-11-10
  writtenExam: 2025-12-07
  source: https://jshrss.jiangsu.gov.cn/col/col92911/index.html
  sample: true
  official:
    positions: null            # 公告只披露招录计划 8179 人
    headcount: 8179
  ageRule:
    refYear: 2025             # 公告:18周岁以上、38周岁以下(1986年11月至2007年11月期间出生)
    refMonth: 11
    minAge: 18
    maxAge: 38
    maxAgeFreshPg: 43         # 具有硕士及以上学位的2026年应届毕业研究生放宽到43周岁(1981年11月以后出生)
    policeMaxAge: 38          # 公安、司法行政警察及法警按专门通知执行,系统不区分,由 ageSpecial 提示
    policeMaxAgeFreshPg: 43
    note: 公告:18周岁以上、38周岁以下(1986年11月至2007年11月期间出生);普通高校硕士及以上学位的2026年应届毕业研究生、面向优秀村(社区)党组织书记(主任)招录职位的报考者放宽到43周岁以下(1981年11月以后出生);公安、司法行政机关人民警察及法院、检察院司法警察职位按《关于调整公安机关和监狱及劳动教养管理机关录用人民警察招考年龄的通知》执行。
  # 职位代码(两位)分组含义,取自公告「考录对象及有关要求」;每年公告都要核对范围和文字
  codeGroups:
    - range: [50, 59]
      label: 专技类特殊职位
      note: 专技类特殊职位(代码50-59)还须符合《公安机关公务员(人民警察)简章》的相关条件
    - range: [60, 69]
      label: 面向应届毕业生职位
      freshAlt: 除2026年普通高校应届毕业生外,还包括报名前服务期满2年内的西部计划/三支一扶/志愿服务乡村振兴计划志愿者、2024年9月后取得境外学位的留学回国人员、当年入伍并于2024年9月后退役的军人
      residency: 应届类职位:具有研究生学历并取得相应学位者不受生源地限制,其他报考者须为江苏生源
    - range: [70, 74]
      label: 法官助理职位
      note: 法官助理职位还须符合《法官助理、检察官助理简章》规定的条件
    - range: [75, 79]
      label: 检察官助理职位
      note: 检察官助理职位还须符合《法官助理、检察官助理简章》规定的条件
    - range: [80, 81]
      label: 面向残疾人职位
      identity: 限持有第二代《残疾人证》且符合职位要求的残疾类别、等级的人员
    - range: [90, 96]
      label: 面向服务基层项目人员职位
      projects: [village, west, sanzhi, rural, veteran, soldier]
    - range: [98, 98]
      label: 面向优秀村(社区)党组织书记(主任)职位
      identity: 限在本县(市、区)村(社区)工作满5年、任职2年以上且表现优秀的现任村(社区)党组织书记(主任)等,具体标准由各设区市制定
  notices:
    - 设区市以下机关职位的生源地/户籍要求由各设区市在招考简章中公布(公告附件1),不在职位表里;系统只能识别职位表「其它」列写明的户籍限制,请务必核对所在市的简章。
    - 公安、司法行政机关人民警察和法院、检察院司法警察职位的年龄按专门通知执行(通常更严),这类职位的年龄结果最多显示为「待确认」。
    - 专业按《江苏省专业参考目录》的专业大类展开,并映射到国家专业目录;不在目录内的专业(自考、成教、境外院校等),招录机关可另行审核。
    - 系统未处理视力、体能、值夜班等体检和岗位要求,请阅读「其它」原文。

