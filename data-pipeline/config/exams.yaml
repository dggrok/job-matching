# 考试元信息与「公告级规则」。
#
# 每年公告发布后,必须核对公告原文(一、报考条件),更新对应年度的 ageRule 等字段。
# 公告级规则不在职位表里,是所有职位共用的条件。
#
# ageRule 的计算约定(与国考公告的写法一致,以公告原文为准):
#   "38周岁以下(1986年10月至2007年10月期间出生)":报名年份为 Y、月份为 M 时,
#   最早出生年月 = (Y - maxAge - 1 年, M 月),最晚出生年月 = (Y - minAge 年, M 月)。
#   例:Y=2025, M=10, maxAge=38 → 最早 1986-10;minAge=18 → 最晚 2007-10。

guokao-2026:
  kind: guokao                # 国考(界面按 kind 区分展示口径)
  name: 中央机关及其直属机构2026年度考试录用公务员
  type: guokao
  year: 2026                  # 年度(应届毕业生届别)
  graduateYear: 2026          # 应届毕业生届别
  file: raw/guokao-2026.xls
  publishedAt: 2025-10-14
  signup: 2025-10-15 至 2025-10-24
  writtenExam: 2025-11-29 至 2025-11-30
  source: http://bm.scs.gov.cn/kl2026
  sample: true                # 开发样本(第三方镜像的官方表),上线数据应替换为最新一年
  official:                   # 官方公告披露的总数,构建时用来校验
    positions: 20714
    headcount: 38119
  ageRule:
    refYear: 2025             # 公告与报名所在年份
    refMonth: 10
    minAge: 18
    maxAge: 38                # 一般报考者
    maxAgeFreshPg: 43         # 应届硕士、博士研究生
    policeMaxAge: 30          # 市(地)级及以下公安机关人民警察职位
    policeMaxAgeFreshPg: 35
    note: 公告:年龄一般为18周岁以上、38周岁以下(1986年10月至2007年10月期间出生);2026年应届硕士、博士研究生放宽到43周岁以下(1981年10月以后出生)。市(地)级及以下公安机关人民警察职位一般为30周岁以下(1994年10月以后出生),应届硕博和法医职位放宽到35周岁以下(1989年10月以后出生)。

# 2027 年度:预计 2026-10-14 发布,发布后取得职位表放入 raw/guokao-2027.xls,
# 再按公告核对以下所有字段(尤其是 ageRule、official、signup、writtenExam),然后取消 pending。
guokao-2027:
  kind: guokao
  name: 中央机关及其直属机构2027年度考试录用公务员
  type: guokao
  year: 2027
  graduateYear: 2027
  file: raw/guokao-2027.xls
  publishedAt: null
  signup: null
  writtenExam: null
  source: http://bm.scs.gov.cn/kl2027
  pending: true               # 尚未发布,构建时跳过
  official:
    positions: null
    headcount: null
  ageRule:
    # 以下为占位,沿用 2026 年度口径,公告发布后必须核对修改
    refYear: 2026
    refMonth: 10
    minAge: 18
    maxAge: 38
    maxAgeFreshPg: 43
    policeMaxAge: 30
    policeMaxAgeFreshPg: 35
    note: 占位,沿用2026年度口径,请以2027年度公告为准。


# =====================================================================
# 省考(二期)。省考各省自行命题,职位表格式、年龄/学历/户籍规则各不相同:
# 每个省一个导入器(src/importers)+ 一个构建函数(src/normalize),公告级规则写在这里。
# 每年公告发布后,除了换掉 raw 里的文件,还必须逐条核对本节的 ageRule、notices、codeGroups。
# =====================================================================

# ---------------- 浙江 ----------------
# 官方入口:浙江省公务员考试录用网 http://gwy.zjks.gov.cn/ 首页「招考公告」→「浙江省各级机关单位20XX年度考试录用公务员公告」,
# 公告正文末尾的附件《20XX年浙江省各级机关单位公务员招考计划一览表》(xlsx),下载后保存为 raw/zhejiang-20XX.xlsx。
zhejiang-2026:
  kind: shengkao
  province: 浙江
  name: 浙江省各级机关单位2026年度考试录用公务员
  type: zhejiang
  year: 2026
  graduateYear: 2026
  file: raw/zhejiang-2026.xlsx
  pgClassSuffixExact: true    # 研究生「××类」即一级学科名(法学类=法学),命中时不降级为待确认
  publishedAt: 2025-11-03
  signup: 2025-11-06 至 2025-11-11
  writtenExam: 2025-12-07
  source: http://gwy.zjks.gov.cn/
  sample: true                # 2026 年度(去年)数据,2027 年度公告发布后替换
  official:                   # 公告披露 5712 名(含山区海岛县专项招录预留 318 名),与职位表合计口径不同,不做等值校验
    positions: null
    headcount: null
  ageRule:
    refYear: 2025             # 公告:年龄18至38周岁(1986年11月至2007年11月期间出生)
    refMonth: 11
    minAge: 18
    maxAge: 38
    maxAgeFreshPg: 43         # 2026年硕士以上应届毕业生放宽至43周岁(1981年11月起)
    policeMaxAge: 30          # 警察类职位 30 周岁、应届硕博 35 周岁;职位表逐条写明,以职位年龄为准
    policeMaxAgeFreshPg: 35
    note: 公告:年龄18至38周岁(1986年11月至2007年11月期间出生),2026年硕士以上应届毕业生放宽至43周岁(1981年11月起)。法院、检察院、公安、司法行政系统人民警察职位一般为30周岁以下(应届硕博35周岁),团委职位28周岁以下,乡镇专职人武干部30周岁以下,优秀村干部现任村“两委”正职43周岁以下;各职位以职位表「年龄要求」为准。
  notices:
    - 本表为公告附件《招考计划一览表》中的职位,合计约 5262 人;公告披露全省计划 5712 名(含山区海岛县专项招录预留计划 318 名),口径不同,未收录的职位请到浙江省公务员考试录用网和各市党建/人才网站查询。
    - 报考市以下机关时,其他职位的招考范围和对象(如户籍、生源)由各地公告明确,系统无法覆盖,请核对所在市的公告。
    - 「所在地」由招录单位名称推断,个别单位可能显示为空。

